services:
  agentquest:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTQUEST_DATA_DIR: ${AGENTQUEST_DATA_DIR:-/app/data}
      AGENTQUEST_MODEL_PATH: ${AGENTQUEST_MODEL_PATH:-/app/local_models/Qwen_Qwen3-4B-Q4_K_L.gguf}
      AGENTQUEST_RUNS_DIR: ${AGENTQUEST_RUNS_DIR:-/app/runs}
      AGENTQUEST_MODELS_DIR: ${AGENTQUEST_MODELS_DIR:-/app/local_models}
      STREAMLIT_SERVER_ADDRESS: ${STREAMLIT_SERVER_ADDRESS:-0.0.0.0}
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
      STREAMLIT_SERVER_HEADLESS: ${STREAMLIT_SERVER_HEADLESS:-true}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: ${STREAMLIT_BROWSER_GATHER_USAGE_STATS:-false}
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:${STREAMLIT_SERVER_PORT:-8501}"
    volumes:
      - ./data:/app/data
      - ./local_models:/app/local_models:ro
      - ./runs:/app/runs
    command: streamlit run streamlit_app.py
